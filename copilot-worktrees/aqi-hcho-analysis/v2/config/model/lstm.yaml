# ============================================================
# LSTM Model Configuration
# ============================================================

model:
  name: "lstm"
  type: "lstm"
  
  # Architecture
  lstm_units: 128
  dropout_rate: 0.3
  
  # Training
  learning_rate: 0.001
  batch_size: 32
  epochs: 100
  
  # Data
  seq_length: 7
  n_features: 16
  
  # Output
  n_outputs: 1