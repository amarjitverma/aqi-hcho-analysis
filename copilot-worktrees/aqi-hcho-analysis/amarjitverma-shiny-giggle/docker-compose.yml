# ============================================================
# AQI & HCHO Hotspot Analysis - docker-compose.yml
# ============================================================

version: '3.8'

services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - GEE_PROJECT=${GEE_PROJECT}
      - CDS_API_KEY=${CDS_API_KEY}
      - FIRMS_API_KEY=${FIRMS_API_KEY}
      - OPENAQ_API_KEY=${OPENAQ_API_KEY}
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./runtime/logs:/app/runtime/logs
    restart: unless-stopped