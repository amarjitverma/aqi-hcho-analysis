# ============================================================
# Training Configuration
# ============================================================

# General training parameters
general:
  epochs: 100
  batch_size: 32
  validation_split: 0.15
  test_split: 0.15
  random_state: 42
  verbose: 1

# Learning rate
learning_rate:
  initial: 0.001
  min: 1e-7
  schedule: "reduce_on_plateau"
  factor: 0.5
  patience: 5

# Early stopping
early_stopping:
  patience: 10
  monitor: "val_loss"
  mode: "min"
  restore_best_weights: true

# Model-specific parameters
models:
  lstm:
    lstm_units: 128
    dropout_rate: 0.3
    learning_rate: 0.001
    batch_size: 32
    epochs: 100
    
  cnn_lstm:
    conv_filters: 64
    lstm_units: 128
    learning_rate: 0.001
    batch_size: 16
    epochs: 100
    
  convlstm:
    filters: 64
    kernel_size: 3
    lstm_units: 128
    learning_rate: 0.001
    batch_size: 16
    epochs: 100
    
  transformer:
    d_model: 128
    n_heads: 8
    n_layers: 4
    learning_rate: 0.001
    batch_size: 32
    epochs: 100

# Callbacks
callbacks:
  checkpoint:
    save_best_only: true
    monitor: "val_loss"
    mode: "min"
    
  early_stopping:
    patience: 10
    monitor: "val_loss"
    restore_best_weights: true
    
  reduce_lr:
    factor: 0.5
    patience: 5
    min_lr: 1e-7