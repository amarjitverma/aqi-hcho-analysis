# ============================================================
# Transformer Model Configuration
# ============================================================

model:
  name: "transformer"
  type: "transformer"
  
  # Architecture
  d_model: 128
  n_heads: 8
  n_layers: 4
  d_ff: 256
  dropout_rate: 0.1
  
  # Training
  learning_rate: 0.001
  batch_size: 32
  epochs: 100
  
  # Data
  seq_length: 7
  n_features: 16
  
  # Output
  n_outputs: 1