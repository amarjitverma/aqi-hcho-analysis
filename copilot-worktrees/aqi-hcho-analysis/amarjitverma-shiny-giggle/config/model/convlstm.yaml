# ============================================================
# ConvLSTM Model Configuration
# ============================================================

model:
  name: "convlstm"
  type: "convlstm"
  
  # Architecture
  filters: 64
  kernel_size: 3
  lstm_units: 128
  dropout_rate: 0.3
  
  # Training
  learning_rate: 0.001
  batch_size: 16
  epochs: 100
  
  # Data
  seq_length: 7
  grid_size: 120
  n_channels: 6
  
  # Output
  n_outputs: 1