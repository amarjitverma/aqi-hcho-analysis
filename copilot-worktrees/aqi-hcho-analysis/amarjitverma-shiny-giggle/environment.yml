# ============================================================
# AQI & HCHO Hotspot Analysis - Conda Environment
# ============================================================

name: aqi-hcho-analysis
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - numpy=1.24.3
  - pandas=2.0.3
  - xarray=2023.7.0
  - netcdf4=1.6.4
  - scipy=1.11.1
  - statsmodels=0.14.0
  - geopandas=0.14.0
  - rasterio=1.3.9
  - shapely=2.0.1
  - pyproj=3.6.0
  - folium=0.14.0
  - geemap=0.21.0
  - earthengine-api=0.1.371
  - tensorflow=2.13.0
  - scikit-learn=1.3.0
  - matplotlib=3.7.2
  - seaborn=0.12.2
  - plotly=5.15.0
  - streamlit=1.25.0
  - requests=2.31.0
  - cdsapi=0.6.0
  - python-dotenv=1.0.0
  - tqdm=4.65.0
  - joblib=1.3.1
  - pyyaml=6.0
  - click=8.1.7
  - loguru=0.7.2
  - jupyter=1.0.0
  - jupyterlab=4.0.6
  - pytest=7.4.2
  - optuna=3.3.0
  - shap=0.42.1
